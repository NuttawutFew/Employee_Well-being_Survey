version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: mental-health-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mental-health-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/mental_health_assessment
      MONGODB_DB_NAME: mental_health_assessment
    ports:
      - "4000:4000"
    depends_on:
      - mongo

volumes:
  mongo_data:
